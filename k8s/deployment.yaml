apiVersion: apps/v1
kind: Deployment
metadata:
  name: hebei-command-center
  labels:
    app: hebei-command-center
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hebei-command-center
  template:
    metadata:
      labels:
        app: hebei-command-center
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: database-migrate
          image: hebei-command-center:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "server/migrate.js"]
          envFrom:
            - configMapRef:
                name: hebei-command-center-config
            - secretRef:
                name: hebei-command-center-secrets
      containers:
        - name: hebei-command-center
          image: hebei-command-center:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hebei-command-center-config
            - secretRef:
                name: hebei-command-center-secrets
          ports:
            - name: http
              containerPort: 4174
          volumeMounts:
            - name: runtime-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: runtime-data
          persistentVolumeClaim:
            claimName: hebei-command-center-data
      terminationGracePeriodSeconds: 30
