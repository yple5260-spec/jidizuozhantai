apiVersion: v1
kind: Secret
metadata:
  name: hebei-command-center-secrets
type: Opaque
stringData:
  DATABASE_URL: mysql://USER:PASSWORD@ACK_INTERNAL_HOST:3306/DATABASE
  SESSION_SECRET: replace-with-at-least-32-random-characters
  BOOTSTRAP_ADMIN_JOB_NO: admin
  BOOTSTRAP_ADMIN_NAME: 系统管理员
  BOOTSTRAP_ADMIN_PASSWORD: replace-with-a-strong-one-time-password
  DEEPSEEK_API_KEY: replace-with-deepseek-api-key
